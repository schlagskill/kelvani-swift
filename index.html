<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>KelvaniSwift</title>
    <link rel="icon" href="assets/icons/icon32.png" />
    <link rel="stylesheet" href="swift.css" /><link rel="stylesheet" href="hub.css" />
    <script type="module" src="controller.js?v=0.7.0-final"></script>
  <link rel="stylesheet" href="assets/ui/tokens.css?v=1.0"><link rel="stylesheet" href="assets/ui/components.css?v=1.0"><link rel="stylesheet" href="workspace-ui.css?v=0.7.0-final"><script type="module" src="assets/ui/review.js?v=1.1"></script></head>
  <body>
    <header class="app-header">
      <a class="brand" href="index.html#view=home" aria-label="KelvaniSwift"><img class="brand-symbol" src="assets/brand-mark.png" width="34" height="34" alt=""><span class="brand-name">Kelvani<span>Swift</span></span></a>
        <div class="search-row">
          <label class="search-box"
            ><span id="search-icon" aria-hidden="true"></span
            ><input
              id="search"
              type="search"
              autocomplete="off"
              data-placeholder="search"
              aria-label="Arbeitsbereiche und Tabs suchen"
            /><kbd>⌘ K</kbd></label
          ><button
            id="capture"
            class="primary"
            data-t="capture"
            data-live
          ></button>
        </div>
      <div class="header-actions">
        <button
          id="expand"
          class="icon-button"
          data-title="expand"
          aria-label="In großem Tab öffnen"
        ></button
        ><button
          id="settings"
          class="icon-button"
          data-title="settings"
          aria-label="Einstellungen"
        ></button>
      </div>
    </header>
    <div class="app-shell">
      <aside class="sidebar">      <div class="mode-switch primary-navigation" role="navigation" aria-label="Ansicht">
        <button id="home-view" data-hub="home" aria-pressed="false"></button><button id="saved-view" hidden data-t="workspaces" aria-pressed="true"></button
        ><button id="live-view" data-t="live" aria-pressed="false"></button>
      <button id="templates-entry" class="hub-nav" data-hub="templates"></button></div>

        <div class="sidebar-heading">
          <span data-t="workspaces"></span
          ><button
            id="new-sidebar"
            class="icon-button"
            data-title="newWorkspace"
            aria-label="Neuer Arbeitsbereich"
          ></button>
        </div>
        <button id="overview-entry" hidden data-hub="home"></button>        <button
          id="new-workspace"
          class="sidebar-add secondary"
          data-t="newWorkspace"
        ></button>
<nav id="workspace-list" aria-label="Arbeitsbereiche"></nav>
        <button id="help-entry" class="sidebar-help" data-hub="quickStart"></button><div class="sidebar-bottom">
          <span class="local-dot"></span><span data-t="saved"></span
          ><span id="total-tabs"></span>
        </div>
      </aside>
      <main>
        <div class="popup-workspaces">
          <select
            id="workspace-switch"
            aria-label="Arbeitsbereich auswählen"
          ></select
          ><button
            id="new-popup"
            class="icon-button"
            data-title="newWorkspace"
            aria-label="Neuer Arbeitsbereich"
          ></button>
        </div>
        <section id="home-panel" hidden>
 <div class="hub-hero"><div><h1 data-hub="heroTitle"></h1></div><div class="hub-hero-actions"><button id="home-new" class="primary" data-t="newWorkspace"></button><button id="home-templates" hidden class="secondary" data-hub="fromTemplate"></button><button id="home-guide" class="text-button" data-hub="quickStart"></button></div></div>
 <div id="overview-stats" class="overview-stats" aria-label="Arbeitsbereich-Übersicht"></div><div class="overview-controls"><button id="only-favorites" class="secondary" aria-pressed="false">Favoriten</button><label><span id="sort-label">Sortierung</span><select id="workspace-sort"><option value="updated">Zuletzt bearbeitet</option><option value="name">Name</option><option value="size">Anzahl Tabs</option></select></label></div>
 <div class="hub-section-heading"><h2 class="visually-hidden" data-hub="yourSpaces"></h2><span id="spaces-count" hidden></span></div><div class="space-list-heading" aria-hidden="true"><span data-hub="spaceColumn"></span><span data-hub="tabsColumn"></span><span data-hub="editedColumn"></span><span></span></div><div id="workspace-cards" class="workspace-cards" role="list"></div><div id="home-empty" class="hub-empty" hidden><h3 data-hub="noSpaces"></h3><p hidden data-hub="noSpacesText"></p><button id="home-blank" class="secondary" data-hub="blank"></button></div>

</section>
<section id="templates-panel" hidden><div class="hub-page-heading"><div><h1 data-hub="fromTemplate"></h1><p class="hub-description" data-hub="templatesText"></p></div><button id="templates-blank" class="secondary" data-hub="blank"></button></div><div class="hub-section-heading"><h2 data-hub="starterTemplates"></h2></div><div id="starter-grid" class="template-grid"></div><div class="hub-section-heading"><h2 data-hub="customTemplates"></h2></div><p id="own-template-help" class="hub-description" data-hub="ownHelp"></p><div id="custom-grid" class="template-grid"></div><p id="template-no-results" class="hub-empty" data-hub="noTemplateResults" hidden></p></section><section id="saved-panel">
          <div class="workspace-heading">
            <div class="workspace-title">
              <span id="workspace-symbol" class="workspace-symbol"></span>
              <div>
                <h1 id="workspace-name"></h1>
                <p id="workspace-meta"></p>
              </div>
            </div>
            <div class="workspace-actions">
              <button
                id="favorite"
                class="icon-button"
                aria-label="Als Favorit markieren"
              ></button
              ><button
                id="edit-workspace"
                class="icon-button"
                data-title="edit"
                aria-label="Bearbeiten"
              ></button>
            </div>
          </div>
          <div class="workspace-toolbar">
            <button
              id="open-all"
              class="primary"
              data-t="openAll"
              data-live
            ></button
            ><button id="add-link" class="secondary" data-t="addLink"></button
            ><details id="workspace-more" class="workspace-more"><summary data-hub="more"></summary><div class="workspace-more-menu"><button id="add-current" class="text-button" data-hub="addCurrent" data-live></button><button id="save-space-template" class="text-button" data-hub="saveSpaceTemplate"></button></div></details>
          </div>
          <div class="selection-toolbar" id="selection-toolbar" hidden>
            <button
              id="selection-clear"
              class="icon-button"
              data-title="clearSelection"
              aria-label="Auswahl aufheben"
              type="button"
            >
              ×</button
            ><span id="selection-count"></span
            ><button id="open-selected" data-t="open" data-live></button
            ><select id="move-target" aria-label="Verschieben nach"></select
            ><button id="move-selected" data-t="move"></button
            ><button
              id="remove-selected"
              class="danger-text"
              data-t="remove"
            ></button>
          </div>
          <div class="list-heading">
            <label
              ><input
                id="select-all"
                type="checkbox"
                data-title="selectAll"
                aria-label="Alle sichtbaren Tabs auswählen" /><span
                data-t="saved"
              ></span></label
            ><span id="tab-count"></span>
          </div>
          <div id="tab-list" class="tab-list"></div>
          <div id="empty" class="empty-state" hidden>
            <span class="empty-symbol" aria-hidden="true">↗</span>
            <h2 id="empty-title"></h2>
            <p id="empty-help"></p>
            <button
              id="empty-create"
              class="primary"
              data-t="newWorkspace"
            ></button>
          </div>
        </section>
        <section id="live-panel" hidden>
          <div class="live-heading">
            <div>
              <h1 data-t="live"></h1>
              <p id="live-summary"></p>
            </div>
            <button
              id="capture-selected"
              class="secondary"
              data-t="captureSelected"
              data-live
            ></button>
          </div>
          <div id="live-list"></div>
        </section>
        <footer class="main-footer">
          <span id="preview-label" hidden data-t="preview"></span
          ><span class="shortcut-hint" data-t="shortcuts"></span>
        </footer>
      </main>
      <aside class="detail-panel" id="details"></aside>
    </div>
    <div
      id="notice"
      class="notice"
      role="status"
      aria-live="polite"
      hidden
    ></div>
    <dialog id="workspace-dialog" aria-labelledby="workspace-dialog-title">
      <form id="workspace-form">
        <div class="dialog-heading">
          <h2 id="workspace-dialog-title"></h2>
          <button
            type="button"
            data-close
            class="icon-button"
            data-title="close"
            aria-label="Schließen"
          >
            ×
          </button>
        </div>
        <label
          ><span data-t="name"></span
          ><input id="edit-name" maxlength="80" required autocomplete="off"
        /></label>
        <div class="form-row">
          <label
            ><span data-t="color"></span
            ><select id="edit-color"></select></label
          ><label
            ><span data-t="icon"></span
            ><select id="edit-icon"></select
          ></label>
        </div>
        <label class="checkbox-label"
          ><input type="checkbox" id="edit-favorite" /><span
            data-t="favorite"
          ></span
        ></label>
        <div id="workspace-manage" class="manage-actions" hidden>
          <button
            type="button"
            id="duplicate-workspace"
            class="secondary"
            data-t="duplicate"
          ></button
          ><button
            type="button"
            id="delete-workspace"
            class="danger-text"
            data-t="delete"
          ></button>
        </div>
        <div class="dialog-footer">
          <button
            type="button"
            data-close
            class="secondary"
            data-t="cancel"
          ></button
          ><button type="submit" class="primary" data-t="save"></button>
        </div>
      </form>
    </dialog>
    <dialog id="link-dialog">
      <form id="link-form">
        <div class="dialog-heading">
          <h2 data-t="addLink"></h2>
          <button
            type="button"
            data-close
            class="icon-button"
            aria-label="Schließen"
          >
            ×
          </button>
        </div>
        <label
          ><span data-t="url"></span
          ><input
            id="link-url"
            type="url"
            required
            maxlength="8192"
            placeholder="https://example.com"
            autocomplete="off" /></label
        ><label
          ><span data-t="title"></span
          ><input id="link-title" maxlength="300" autocomplete="off"
        /></label>
        <div class="dialog-footer">
          <button
            type="button"
            data-close
            class="secondary"
            data-t="cancel"
          ></button
          ><button type="submit" class="primary" data-t="save"></button>
        </div>
      </form>
    </dialog>
    <dialog id="capture-dialog">
      <form id="capture-form">
        <div class="dialog-heading">
          <h2 data-t="capture"></h2>
          <button
            type="button"
            data-close
            class="icon-button"
            aria-label="Schließen"
          >
            ×
          </button>
        </div>
        <label id="capture-window-label"
          ><span data-t="window"></span
          ><select id="capture-window"></select
        ></label>
        <div id="capture-preview" class="capture-preview"></div>
        <label
          ><span data-t="target"></span
          ><select id="capture-mode">
            <option value="new" data-t="newTarget"></option>
            <option value="append" data-t="append"></option>
            <option value="replace" data-t="replace"></option></select></label
        ><label id="capture-name-label"
          ><span data-t="name"></span
          ><input
            id="capture-name"
            maxlength="80"
            required
            autocomplete="off" /></label
        ><label id="capture-target-label" hidden
          ><span data-t="workspaces"></span
          ><select id="capture-target"></select
        ></label>
        <p class="small-help" data-t="captureHelp"></p>
        <div class="dialog-footer">
          <button
            type="button"
            data-close
            class="secondary"
            data-t="cancel"
          ></button
          ><button type="submit" class="primary" data-t="save"></button>
        </div>
      </form>
    </dialog>
    <dialog id="settings-dialog">
      <form id="settings-form">
        <div class="dialog-heading">
          <h2 data-t="settings"></h2>
          <button
            type="button"
            data-close
            class="icon-button"
            aria-label="Schließen"
          >
            ×
          </button>
        </div>
        <div class="form-row">
          <label
            ><span data-t="language"></span
            ><select id="language">
              <option value="de">Deutsch</option>
              <option value="en">English</option>
            </select></label
          ><label
            ><span data-t="theme"></span
            ><select id="theme">
              <option value="system" data-t="system"></option>
              <option value="light" data-t="light"></option>
              <option value="dark" data-t="dark"></option></select
          ></label>
        </div>
        <p class="small-help" data-t="local"></p>
        <div class="backup-actions">
          <button
            type="button"
            id="export"
            class="secondary"
            data-t="backup"
          ></button
          ><label class="button secondary file-label"
            ><span data-t="import"></span
            ><input id="import" type="file" accept=".json,application/json"
          /></label>
        </div>
        <button
          type="button"
          id="demo"
          class="text-button"
          data-t="demo"
          hidden
        ></button>
        <div class="dialog-footer">
          <button
            type="button"
            data-close
            class="secondary"
            data-t="cancel"
          ></button
          ><button type="submit" class="primary" data-t="save"></button>
        </div>
      </form>
    </dialog>
    <dialog id="confirm-dialog" aria-labelledby="confirm-title">
      <div class="dialog-heading">
        <h2 id="confirm-title"></h2>
        <button
          type="button"
          data-close
          class="icon-button"
          aria-label="Schließen"
        >
          ×
        </button>
      </div>
      <p id="confirm-text"></p>
      <div class="dialog-footer">
        <button id="confirm-cancel" class="secondary" data-t="cancel"></button
        ><button id="confirm-ok" class="primary" data-t="save"></button>
      </div>
    </dialog>
  <dialog id="guide-dialog" aria-labelledby="guide-title"><div class="dialog-heading"><h2 id="guide-title" data-hub="quickStart"></h2><button type="button" data-close class="icon-button" aria-label="Schließen">×</button></div><div class="guide-steps"><section><span>01</span><h3 data-hub="step1"></h3><p data-hub="step1Text"></p></section><section><span>02</span><h3 data-hub="step2"></h3><p data-hub="step2Text"></p></section><section><span>03</span><h3 data-hub="step3"></h3><p data-hub="step3Text"></p></section></div><p class="guide-note" data-hub="savedHelp"></p><div class="dialog-footer"><button type="button" data-close class="primary" data-hub="close"></button></div></dialog>
<dialog id="template-dialog" aria-labelledby="template-title"><form id="template-form"><div class="dialog-heading"><div><h2 id="template-title" data-hub="preview"></h2></div><button type="button" data-close class="icon-button" aria-label="Schließen">×</button></div><label><span data-hub="name"></span><input id="template-name" maxlength="80" required autocomplete="off"></label><div class="form-row"><label><span data-hub="color"></span><select id="template-color"></select></label><label><span data-hub="icon"></span><select id="template-icon"></select></label></div><p class="small-help" data-hub="editorHelp"></p><div id="template-links" class="template-links"></div><button type="button" id="template-add-link" class="text-button" data-hub="addLink"></button><div class="template-manage"><button id="template-update" type="button" class="secondary" data-hub="updateTemplate" hidden></button><button id="template-save-new" type="button" class="secondary" data-hub="saveNewTemplate"></button><button id="template-delete" type="button" class="danger-text" data-hub="deleteTemplate" hidden></button></div><div class="dialog-footer"><button type="button" data-close class="secondary" data-hub="cancel"></button><button type="submit" class="primary" data-hub="create"></button></div></form></dialog></body>
</html>
