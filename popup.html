<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>KelvaniSwift</title>
    <link rel="icon" href="assets/icons/icon32.png" />
    <link rel="stylesheet" href="swift.css" />
    <script type="module" src="controller.js"></script>
  </head>
  <body data-compact="true">
    <header class="app-header">
      <a class="brand" href="index.html" aria-label="KelvaniSwift"
        ><img src="assets/logo.png" alt="KelvaniSwift" width="154" height="36"
      /></a>
      <div class="mode-switch" role="group" aria-label="Ansicht">
        <button id="saved-view" data-t="workspaces" aria-pressed="true"></button
        ><button id="live-view" data-t="live" aria-pressed="false"></button>
      </div>
      <div class="header-actions">
        <button
          id="expand"
          class="icon-button"
          data-title="expand"
          aria-label="In großem Tab öffnen"
        ></button
        ><button
          id="settings"
          class="icon-button"
          data-title="settings"
          aria-label="Einstellungen"
        ></button>
      </div>
    </header>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-heading">
          <span data-t="workspaces"></span
          ><button
            id="new-sidebar"
            class="icon-button"
            data-title="newWorkspace"
            aria-label="Neuer Arbeitsbereich"
          ></button>
        </div>
        <nav id="workspace-list" aria-label="Arbeitsbereiche"></nav>
        <button
          id="new-workspace"
          class="sidebar-add"
          data-t="newWorkspace"
        ></button>
        <div class="sidebar-bottom">
          <span class="local-dot"></span><span data-t="saved"></span
          ><span id="total-tabs"></span>
        </div>
      </aside>
      <main>
        <div class="search-row">
          <label class="search-box"
            ><span id="search-icon" aria-hidden="true"></span
            ><input
              id="search"
              type="search"
              autocomplete="off"
              data-placeholder="search"
              aria-label="Arbeitsbereiche und Tabs suchen"
            /><kbd>⌘ K</kbd></label
          ><button
            id="capture"
            class="primary"
            data-t="capture"
            data-live
          ></button>
        </div>
        <div class="popup-workspaces">
          <select
            id="workspace-switch"
            aria-label="Arbeitsbereich auswählen"
          ></select
          ><button
            id="new-popup"
            class="icon-button"
            data-title="newWorkspace"
            aria-label="Neuer Arbeitsbereich"
          ></button>
        </div>
        <section id="saved-panel">
          <div class="workspace-heading">
            <div class="workspace-title">
              <span id="workspace-symbol" class="workspace-symbol"></span>
              <div>
                <h1 id="workspace-name"></h1>
                <p id="workspace-meta"></p>
              </div>
            </div>
            <div class="workspace-actions">
              <button
                id="favorite"
                class="icon-button"
                aria-label="Als Favorit markieren"
              ></button
              ><button
                id="edit-workspace"
                class="icon-button"
                data-title="edit"
                aria-label="Bearbeiten"
              ></button>
            </div>
          </div>
          <div class="workspace-toolbar">
            <button
              id="open-all"
              class="primary"
              data-t="openAll"
              data-live
            ></button
            ><button id="add-link" class="secondary" data-t="addLink"></button
            ><span class="snapshot-hint" data-t="snapshot"></span>
          </div>
          <div class="selection-toolbar" id="selection-toolbar" hidden>
            <span id="selection-count"></span
            ><button id="open-selected" data-t="open" data-live></button
            ><select id="move-target" aria-label="Verschieben nach"></select
            ><button id="move-selected" data-t="move"></button
            ><button
              id="remove-selected"
              class="danger-text"
              data-t="remove"
            ></button>
          </div>
          <div class="list-heading">
            <label
              ><input
                id="select-all"
                type="checkbox"
                data-title="selectAll"
                aria-label="Alle sichtbaren Tabs auswählen" /><span
                data-t="saved"
              ></span></label
            ><span id="tab-count"></span>
          </div>
          <div id="tab-list" class="tab-list"></div>
          <div id="empty" class="empty-state" hidden>
            <span class="empty-symbol" aria-hidden="true">↗</span>
            <h2 id="empty-title"></h2>
            <p id="empty-help"></p>
            <button
              id="empty-create"
              class="primary"
              data-t="newWorkspace"
            ></button>
          </div>
        </section>
        <section id="live-panel" hidden>
          <div class="live-heading">
            <div>
              <h1 data-t="live"></h1>
              <p data-t="liveHelp"></p>
            </div>
            <button
              id="capture-selected"
              class="secondary"
              data-t="captureSelected"
              data-live
            ></button>
          </div>
          <div id="live-list"></div>
        </section>
        <footer class="main-footer">
          <span id="preview-label" hidden data-t="preview"></span
          ><span class="shortcut-hint" data-t="shortcuts"></span>
        </footer>
      </main>
      <aside class="detail-panel" id="details"></aside>
    </div>
    <div
      id="notice"
      class="notice"
      role="status"
      aria-live="polite"
      hidden
    ></div>
    <dialog id="workspace-dialog">
      <form id="workspace-form">
        <div class="dialog-heading">
          <h2 id="workspace-dialog-title"></h2>
          <button
            type="button"
            data-close
            class="icon-button"
            data-title="close"
            aria-label="Schließen"
          >
            ×
          </button>
        </div>
        <label
          ><span data-t="name"></span
          ><input id="edit-name" maxlength="80" required autocomplete="off"
        /></label>
        <div class="form-row">
          <label
            ><span data-t="color"></span
            ><select id="edit-color"></select></label
          ><label
            ><span data-t="icon"></span
            ><select id="edit-icon"></select
          ></label>
        </div>
        <label class="checkbox-label"
          ><input type="checkbox" id="edit-favorite" /><span
            data-t="favorite"
          ></span
        ></label>
        <div id="workspace-manage" class="manage-actions" hidden>
          <button
            type="button"
            id="duplicate-workspace"
            class="secondary"
            data-t="duplicate"
          ></button
          ><button
            type="button"
            id="delete-workspace"
            class="danger-text"
            data-t="delete"
          ></button>
        </div>
        <div class="dialog-footer">
          <button
            type="button"
            data-close
            class="secondary"
            data-t="cancel"
          ></button
          ><button type="submit" class="primary" data-t="save"></button>
        </div>
      </form>
    </dialog>
    <dialog id="link-dialog">
      <form id="link-form">
        <div class="dialog-heading">
          <h2 data-t="addLink"></h2>
          <button
            type="button"
            data-close
            class="icon-button"
            aria-label="Schließen"
          >
            ×
          </button>
        </div>
        <label
          ><span data-t="url"></span
          ><input
            id="link-url"
            type="url"
            required
            maxlength="8192"
            placeholder="https://example.com"
            autocomplete="off" /></label
        ><label
          ><span data-t="title"></span
          ><input id="link-title" maxlength="300" autocomplete="off"
        /></label>
        <div class="dialog-footer">
          <button
            type="button"
            data-close
            class="secondary"
            data-t="cancel"
          ></button
          ><button type="submit" class="primary" data-t="save"></button>
        </div>
      </form>
    </dialog>
    <dialog id="capture-dialog">
      <form id="capture-form">
        <div class="dialog-heading">
          <h2 data-t="capture"></h2>
          <button
            type="button"
            data-close
            class="icon-button"
            aria-label="Schließen"
          >
            ×
          </button>
        </div>
        <label id="capture-window-label"
          ><span data-t="window"></span
          ><select id="capture-window"></select
        ></label>
        <div id="capture-preview" class="capture-preview"></div>
        <label
          ><span data-t="target"></span
          ><select id="capture-mode">
            <option value="new" data-t="newTarget"></option>
            <option value="append" data-t="append"></option>
            <option value="replace" data-t="replace"></option></select></label
        ><label id="capture-name-label"
          ><span data-t="name"></span
          ><input
            id="capture-name"
            maxlength="80"
            required
            autocomplete="off" /></label
        ><label id="capture-target-label" hidden
          ><span data-t="workspaces"></span
          ><select id="capture-target"></select
        ></label>
        <p class="small-help" data-t="captureHelp"></p>
        <div class="dialog-footer">
          <button
            type="button"
            data-close
            class="secondary"
            data-t="cancel"
          ></button
          ><button type="submit" class="primary" data-t="save"></button>
        </div>
      </form>
    </dialog>
    <dialog id="settings-dialog">
      <form id="settings-form">
        <div class="dialog-heading">
          <h2 data-t="settings"></h2>
          <button
            type="button"
            data-close
            class="icon-button"
            aria-label="Schließen"
          >
            ×
          </button>
        </div>
        <div class="form-row">
          <label
            ><span data-t="language"></span
            ><select id="language">
              <option value="de">Deutsch</option>
              <option value="en">English</option>
            </select></label
          ><label
            ><span data-t="theme"></span
            ><select id="theme">
              <option value="system" data-t="system"></option>
              <option value="light" data-t="light"></option>
              <option value="dark" data-t="dark"></option></select
          ></label>
        </div>
        <p class="small-help" data-t="local"></p>
        <div class="backup-actions">
          <button
            type="button"
            id="export"
            class="secondary"
            data-t="backup"
          ></button
          ><label class="button secondary file-label"
            ><span data-t="import"></span
            ><input id="import" type="file" accept=".json,application/json"
          /></label>
        </div>
        <button
          type="button"
          id="demo"
          class="text-button"
          data-t="demo"
          hidden
        ></button>
        <div class="dialog-footer">
          <button
            type="button"
            data-close
            class="secondary"
            data-t="cancel"
          ></button
          ><button type="submit" class="primary" data-t="save"></button>
        </div>
      </form>
    </dialog>
    <dialog id="confirm-dialog">
      <div class="dialog-heading">
        <h2 id="confirm-title"></h2>
        <button
          type="button"
          data-close
          class="icon-button"
          aria-label="Schließen"
        >
          ×
        </button>
      </div>
      <p id="confirm-text"></p>
      <div class="dialog-footer">
        <button id="confirm-cancel" class="secondary" data-t="cancel"></button
        ><button id="confirm-ok" class="primary" data-t="save"></button>
      </div>
    </dialog>
  </body>
</html>
